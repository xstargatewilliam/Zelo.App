# Compila o Zelo no Windows a cada envio. Quando a <Version> do Directory.Build.props muda
# para um número ainda não publicado, cria a versão na página Releases com o pacote já compilado
# (que instala sem precisar do .NET SDK) e o .sha256 que a atualização automática confere.
name: Compilar

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Por padrão, só leitura. Só os trabalhos que publicam (capturas e versões) recebem escrita.
permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read   # a SignPath baixa o pacote sem assinatura deste trabalho
    env:
      # Só existe depois que o projeto for aprovado na SignPath Foundation (veja docs/ASSINATURA.md).
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    outputs:
      numero: ${{ steps.versao.outputs.numero }}
      publicada: ${{ steps.versao.outputs.publicada }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ler a versão
        id: versao
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $v = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "numero=$v" >> $env:GITHUB_OUTPUT
          $existe = $false
          gh release view "v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $existe = $true }
          "publicada=$existe" >> $env:GITHUB_OUTPUT
          Write-Host "Versão $v (já publicada: $existe)"
          # O gh devolve erro quando a versão ainda não existe; isso é esperado.
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Testes automáticos
        shell: pwsh
        run: dotnet test tests/Zelo.Tests/Zelo.Tests.csproj -c Release --nologo --logger "console;verbosity=detailed"

      - name: Compilar serviço e painel (win-x64)
        shell: pwsh
        run: |
          dotnet publish src/Zelo.Service/Zelo.Service.csproj -c Release -r win-x64 --self-contained true -o pacote/publicado/Servico --nologo
          dotnet publish src/Zelo.App/Zelo.App.csproj -c Release -r win-x64 --self-contained true -o pacote/publicado/Painel --nologo
          dotnet publish src/Zelo.Instalador/Zelo.Instalador.csproj -c Release -r win-x64 -o instalador-aot --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force pacote/publicado/Instalador | Out-Null
          Copy-Item instalador-aot/Zelo.Instalador.exe pacote/publicado/Instalador/
          Copy-Item instalador-aot/Zelo.Instalador.exe "pacote/Instalar Zelo.exe"
          Copy-Item README.md, LICENSE -Destination pacote
          Get-ChildItem pacote -Recurse -File -Filter *.exe | ForEach-Object { "{0,10:N0}  {1}" -f $_.Length, $_.FullName.Substring($PWD.Path.Length) }

      - name: Capturas das telas (só fora da main)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath pacote/publicado/Painel/Zelo.App.exe -ArgumentList '--capturas', "$PWD/capturas" -Wait -PassThru
          if (Test-Path capturas/erro.txt) { Get-Content capturas/erro.txt }
          if ($p.ExitCode -ne 0) { Write-Error "O painel falhou ao abrir (código $($p.ExitCode))"; exit 1 }

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        with:
          name: capturas
          path: capturas/*.png

      # Assinatura digital pela SignPath Foundation: só na main, só para uma versão nova, e só depois
      # que o projeto for aprovado (o segredo SIGNPATH_API_TOKEN existir). Cada pedido de assinatura
      # precisa ser aprovado à mão na SignPath; o trabalho espera até 1 hora.
      - name: Enviar o pacote sem assinatura
        id: sem-assinatura
        if: env.SIGNPATH_API_TOKEN != '' && github.ref == 'refs/heads/main' && steps.versao.outputs.publicada == 'False'
        uses: actions/upload-artifact@v4
        with:
          name: pacote-sem-assinatura
          path: pacote/

      - name: Assinar pela SignPath
        if: steps.sem-assinatura.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Zelo.App' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.sem-assinatura.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: pacote-assinado
          parameters: |
            version: "${{ steps.versao.outputs.numero }}"

      - name: Usar o pacote assinado
        if: steps.sem-assinatura.outcome == 'success'
        shell: pwsh
        run: |
          Remove-Item pacote -Recurse -Force
          Move-Item pacote-assinado pacote
          foreach ($f in 'pacote/Instalar Zelo.exe', 'pacote/publicado/Servico/Zelo.Service.exe', 'pacote/publicado/Painel/Zelo.App.exe') {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { Write-Error "$f não ficou assinado"; exit 1 }
          }

      # Instala, reinstala por cima e desinstala de verdade, como faria uma pessoa (sem perguntas).
      - name: Testar instalação e desinstalação
        shell: pwsh
        run: |
          function Conferir($cond, $msg) { if (-not $cond) { Write-Error "FALHOU: $msg"; exit 1 } else { Write-Host "ok: $msg" } }
          $chave = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Zelo'
          $p = Start-Process -FilePath "pacote/Instalar Zelo.exe" -ArgumentList '--automatico' -Wait -PassThru -NoNewWindow
          Conferir ($p.ExitCode -eq 0) "instalação limpa terminou (código $($p.ExitCode))"
          Conferir ((Get-Service Zelo).Status -eq 'Running') 'serviço rodando'
          Conferir (Test-Path "$env:ProgramFiles\Zelo\Instalador\Zelo.Instalador.exe") 'desinstalador copiado'
          Conferir ((Get-ItemProperty $chave).DisplayVersion -eq '${{ steps.versao.outputs.numero }}') 'entrada em Apps com a versão certa'
          Conferir (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Zelo.lnk") 'atalho no Menu Iniciar'
          $p = Start-Process -FilePath "pacote/Instalar Zelo.exe" -ArgumentList '--automatico' -Wait -PassThru -NoNewWindow
          Conferir ($p.ExitCode -eq 0) 'reinstalação por cima terminou'
          Conferir ((Get-Service Zelo).Status -eq 'Running') 'serviço rodando depois de reinstalar'
          $p = Start-Process -FilePath "$env:ProgramFiles\Zelo\Instalador\Zelo.Instalador.exe" -ArgumentList '--desinstalar', '--automatico' -Wait -PassThru -NoNewWindow
          Conferir ($p.ExitCode -eq 0) 'desinstalação terminou'
          Start-Sleep -Seconds 8
          Conferir (-not (Get-Service Zelo -ErrorAction SilentlyContinue)) 'serviço removido'
          Conferir (-not (Test-Path $chave)) 'entrada em Apps removida'
          Conferir (-not (Test-Path "$env:ProgramFiles\Zelo")) 'pasta do programa removida'
          Conferir (Test-Path "$env:ProgramData\Zelo") 'dados mantidos (resposta padrão)'

      - name: Montar o pacote
        shell: pwsh
        run: |
          Compress-Archive -Path pacote/* -DestinationPath Zelo-win-x64.zip
          $h = (Get-FileHash Zelo-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  Zelo-win-x64.zip" | Out-File -Encoding ascii -NoNewline Zelo-win-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Zelo-win-x64
          path: |
            Zelo-win-x64.zip
            Zelo-win-x64.zip.sha256

  # Grava as capturas no ramo "capturas" (para revisar as telas sem baixar artefatos).
  capturas:
    needs: compilar
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: capturas
          path: capturas
      - name: Enviar para o ramo capturas
        run: |
          cd capturas
          git init -q -b capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Capturas de ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

  # Publica a versão nova na página Releases (só na main, só quando a versão ainda não existe).
  publicar:
    needs: compilar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.compilar.outputs.publicada == 'False'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Zelo-win-x64
      - name: Publicar na página Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.compilar.outputs.numero }}
          name: Zelo ${{ needs.compilar.outputs.numero }}
          target_commitish: ${{ github.sha }}
          files: |
            Zelo-win-x64.zip
            Zelo-win-x64.zip.sha256
          body: |
            **Instalar:** baixe o `Zelo-win-x64.zip`, clique com o botão direito → Extrair tudo, e abra `Instalar Zelo.exe`.
            **Remover:** Configurações → Apps → Apps instalados → Zelo → Desinstalar.

            Code signing policy: https://github.com/xstargatewilliam/Zelo.App/blob/main/docs/ASSINATURA.md
          generate_release_notes: true
