# Compila o Zelo no Windows a cada envio. Quando a <Version> do Directory.Build.props muda
# para um número ainda não publicado, cria a versão na página Releases com o pacote já compilado
# (que instala sem precisar do .NET SDK) e o .sha256 que a atualização automática confere.
name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ler a versão
        id: versao
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $v = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "numero=$v" >> $env:GITHUB_OUTPUT
          $existe = $false
          gh release view "v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $existe = $true }
          "publicada=$existe" >> $env:GITHUB_OUTPUT
          Write-Host "Versão $v (já publicada: $existe)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compilar serviço e painel (win-x64)
        shell: pwsh
        run: |
          dotnet publish src/Zelo.Service/Zelo.Service.csproj -c Release -r win-x64 --self-contained true -o pacote/publicado/Servico --nologo
          dotnet publish src/Zelo.App/Zelo.App.csproj -c Release -r win-x64 --self-contained true -o pacote/publicado/Painel --nologo

      - name: Montar o pacote
        shell: pwsh
        run: |
          Copy-Item INSTALAR.bat, DESINSTALAR.bat, README.md, LICENSE -Destination pacote
          Copy-Item scripts -Destination pacote/scripts -Recurse
          Compress-Archive -Path pacote/* -DestinationPath Zelo-win-x64.zip
          $h = (Get-FileHash Zelo-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  Zelo-win-x64.zip" | Out-File -Encoding ascii -NoNewline Zelo-win-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Zelo-win-x64
          path: |
            Zelo-win-x64.zip
            Zelo-win-x64.zip.sha256

      - name: Publicar na página Releases
        if: github.event_name == 'push' && steps.versao.outputs.publicada == 'False'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.numero }}
          name: Zelo ${{ steps.versao.outputs.numero }}
          target_commitish: ${{ github.sha }}
          files: |
            Zelo-win-x64.zip
            Zelo-win-x64.zip.sha256
          generate_release_notes: true
